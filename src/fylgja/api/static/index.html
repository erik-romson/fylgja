<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fylgja-secret" content="{{fylgja-secret}}">
<title>Fylgja</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0 auto; max-width: 72rem; padding: 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  h2 { font-size: 1rem; margin: 1.25rem 0 .5rem; }
  button { font-size: 1rem; padding: .4rem .8rem; }
  #status { min-height: 1.25rem; color: #b00020; margin: 0 0 .5rem; }
  #next-strip { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1rem; padding: 0; list-style: none; }
  #next-strip li { border: 1px solid rgba(128, 128, 128, .5); border-radius: .5rem; padding: .4rem .7rem;
    cursor: pointer; max-width: 22rem; overflow-wrap: anywhere; }
  #next-strip li.top { border-color: #c77700; border-width: 2px; }
  #next-strip .kind { font-size: .75rem; opacity: .65; display: block; }
  #workspace-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: .75rem; }
  .card { border: 1px solid rgba(128, 128, 128, .4); border-radius: .6rem; padding: .7rem .8rem; cursor: pointer; }
  .card.focused { border-color: #1a73e8; border-width: 2px; }
  .card h3 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: .5rem; }
  .card .oneliner { margin: .2rem 0 .5rem; opacity: .8; overflow-wrap: anywhere; }
  .card ul { list-style: none; margin: .25rem 0 0; padding: 0; }
  .card li { padding: .15rem 0; overflow-wrap: anywhere; }
  .card .part { font-size: .75rem; text-transform: uppercase; opacity: .55; margin-top: .5rem; }
  .session { cursor: pointer; border-radius: .3rem; padding: .2rem .3rem; }
  .session.waiting { background: rgba(199, 119, 0, .22); font-weight: 600; }
  .state { font-size: .8rem; opacity: .75; margin-right: .4rem; }
  .muted { opacity: .65; font-size: .85rem; }
  .intro { margin: 0 0 .5rem; }
  .bad { color: #b00020; }
  form { display: flex; gap: .5rem; margin-bottom: .75rem; }
  #todo-input { flex: 1; padding: .5rem; font-size: 1rem; }
  #todo-list { list-style: none; margin: 0; padding: 0; }
  #todo-list li { display: flex; align-items: baseline; gap: .6rem; padding: .35rem 0;
    border-bottom: 1px solid rgba(128, 128, 128, .25); }
  #todo-list li.group { display: block; font-weight: 600; border-bottom: 0; padding-top: 1rem; }
  #todo-list li.sub { font-weight: 500; font-size: .9rem; opacity: .8; padding-top: .75rem; }
  #todo-list li.empty { display: block; border-bottom: 0; opacity: .65; font-size: .9rem; }
  .text { flex: 1; overflow-wrap: anywhere; }
  .from { font-size: .8rem; opacity: .65; white-space: nowrap; }
  .next .text::before { content: "next: "; opacity: .65; }
  #tabs { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0 0 .75rem; }
  #tabs a { color: inherit; text-decoration: none; padding-bottom: .15rem; border-bottom: 2px solid transparent; }
  #tabs a[aria-current="page"] { font-weight: 700; border-bottom-color: currentColor; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { padding: .25rem .5rem; text-align: left; vertical-align: top; overflow-wrap: anywhere;
    border: 1px solid rgba(128, 128, 128, .3); }
  tr.clickable { cursor: pointer; }
  .child td:first-child { padding-left: 1.5rem; }
</style>
</head>
<body>
<h1>Fylgja</h1>
<nav id="tabs" aria-label="Views">
  <a href="#overview" data-tab="overview">Overview</a>
  <a href="#live" data-tab="live">Live data</a>
</nav>
<p id="status" role="status"></p>
<section id="tab-overview" data-tab="overview">
<h2>Next</h2>
<p class="muted intro">What needs you, most urgent first. Click one to go there.</p>
<ul id="next-strip" aria-label="What next"></ul>
<h2>Workspaces</h2>
<p class="muted intro">One card per AeroSpace workspace with something in it. Click a card to focus it.</p>
<div id="workspace-cards"></div>
<h2>Todos</h2>
<form id="todo-form" autocomplete="off">
  <input id="todo-input" type="text" maxlength="500" placeholder="What next? (focused workspace)"
         aria-label="New todo" autofocus>
  <button id="todo-add" type="submit">Add</button>
</form>
<ul id="todo-list"></ul>
</section>
<section id="tab-live" data-tab="live" hidden>
  <h2>Sessions</h2>
  <p class="muted intro">Every live agent session as /now reports it. Click one to focus it.</p>
  <table id="session-table"></table>
</section>
<script>
"use strict";
const secret = document.querySelector('meta[name="fylgja-secret"]').content;
const list = document.getElementById("todo-list");
const input = document.getElementById("todo-input");
const statusLine = document.getElementById("status");
const strip = document.getElementById("next-strip");
const cards = document.getElementById("workspace-cards");
const sessionTable = document.getElementById("session-table");

function say(message) { statusLine.textContent = message || ""; }

async function call(method, path, body) {
  const options = { method, headers: {} };
  if (method !== "GET") {
    options.headers["Authorization"] = "Bearer " + secret;
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  let data = null;
  try { data = await response.json(); } catch (_) { /* no body */ }
  if (!response.ok) {
    const detail = data && typeof data.detail === "string" ? data.detail : "HTTP " + response.status;
    throw new Error(detail);
  }
  return data;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) { node.className = className; }
  if (text !== undefined && text !== null) { node.textContent = text; }
  return node;
}

// The daemon computes, the page renders: every list arrives capped, ordered and grouped, with its
// click targets decided. The page formats instants and durations, maps fixed ids to labels, and
// renders in the order it is given.

// A timestamp as local time. The daemon sends the instants; the page only formats them.
function fmtTime(iso) {
  if (!iso) { return ""; }
  return new Date(iso).toLocaleString(undefined, {
    weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit",
  });
}

// A number of seconds the daemon sent, as "3 h 20 m", "45 m" or "30 s".
function fmtDuration(seconds) {
  const total = Math.max(0, Math.round(Number(seconds) || 0));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  if (hours > 0) { return hours + " h " + minutes + " m"; }
  if (minutes > 0) { return minutes + " m"; }
  return total + " s";
}

// A table from a list of header strings and rows of { cells, className, onClick }.
// A cell is a string or a node; every string goes in as text.
function fillTable(table, head, rows) {
  const header = el("tr");
  header.append(...head.map((name) => el("th", "", name)));
  const body = rows.map((entry) => {
    const line = el("tr", entry.className || "");
    line.append(...entry.cells.map((cell) => {
      const td = el("td");
      td.append(typeof cell === "string" ? document.createTextNode(cell) : cell);
      return td;
    }));
    if (entry.onClick) {
      line.classList.add("clickable");
      line.addEventListener("click", entry.onClick);
    }
    return line;
  });
  table.replaceChildren(header, ...body);
}

// ---- focus ----

async function focusPath(path) {
  try {
    await call("POST", path, {});
    say("");
  } catch (error) {
    say("Cannot focus: " + error.message);
  }
}

function focusWindow(id) { return focusPath("/focus/window/" + encodeURIComponent(id)); }
function focusSession(key) { return focusPath("/focus/session/" + encodeURIComponent(key)); }

// A click target the daemon decided: a session or a window.
function go(ft) { return ft.kind === "session" ? focusSession(ft.ref) : focusWindow(ft.ref); }

// ---- the "next" strip ----

function renderNext(ov) {
  const entries = ov.next.map((ne) => {
    const li = el("li", ne.rank === 1 ? "top" : "");
    li.id = "next-" + ne.rank;
    li.append(el("span", "kind", String(ne.kind || "").replaceAll("_", " ")), el("span", "", ne.reason));
    if (ne.go) { li.addEventListener("click", () => go(ne.go)); } else { li.style.cursor = "default"; }
    return li;
  });
  if (entries.length === 0) {
    entries.push(el("li", "muted", "Nothing waiting for you"));
  }
  strip.replaceChildren(...entries);
}

// ---- workspace cards ----

function projectLine(cp) {
  const line = el("li", "project");
  const parts = [cp.name];
  if (cp.branch) { parts.push(cp.branch); }
  if (cp.dirty) { parts.push("dirty"); }
  if (cp.pr_number) { parts.push("PR #" + cp.pr_number + (cp.pr_checks ? " " + cp.pr_checks : "")); }
  line.textContent = parts.join(" · ");
  if (cp.build_state) {
    line.append(el("span", cp.build_failed ? "state bad" : "state", " build " + cp.build_state));
  }
  return line;
}

function sessionLine(cs) {
  const li = el("li", cs.waiting ? "session waiting" : "session");
  li.id = "session-" + cs.key;
  li.append(el("span", "state", cs.state));
  li.append(el("span", "", cs.text));
  li.addEventListener("click", (event) => { event.stopPropagation(); go(cs.go); });
  return li;
}

function contextLine(cc) {
  const li = el("li", "context", cc.text);
  if (cc.unread) { li.prepend(el("span", "state", "unread")); }
  return li;
}

function todoLine(ct) {
  return el("li", ct.next ? "todo next" : "todo", ct.text);
}

function section(box, title, lines) {
  if (lines.length === 0) { return; }
  const ul = el("ul");
  ul.append(...lines);
  box.append(el("div", "part", title), ul);
}

function workspaceCard(card) {
  const box = el("div", card.focused ? "card focused" : "card");
  box.id = "card-" + card.name;
  const title = el("h3");
  title.append(el("span", "", card.name + (card.label ? " " + card.label : "")));
  title.append(el("span", "muted", card.windows + " windows"));
  box.append(title);
  if (card.one_liner) { box.append(el("p", "oneliner", card.one_liner)); }
  section(box, "Projects", card.projects.map(projectLine));
  section(box, "Sessions", card.sessions.map(sessionLine));
  section(box, "Context", card.context.map(contextLine));
  section(box, "Todos", card.todos.map(todoLine));
  if (card.go) { box.addEventListener("click", () => go(card.go)); }
  return box;
}

function renderCards(ov) {
  const nodes = ov.cards.map((card) => workspaceCard(card));
  if (nodes.length === 0) { nodes.push(el("p", "muted", "No workspace has anything in it")); }
  cards.replaceChildren(...nodes);
}

// ---- todos (step 36) ----

// Import sources are "<collector>-<list kind>"; the collector names where a todo is finished.
const SOURCE_LABELS = { "project-todo-md": "TODO.md" };

function sourceLabel(source) { return SOURCE_LABELS[source] || source.split("-")[0]; }

function todoRow(tr) {
  const li = el("li", tr.next ? "next" : "");
  li.append(el("span", "text", tr.text));
  if (!tr.can_finish) {
    const from = el("span", "from", "from " + sourceLabel(tr.source));
    from.title = "Imported: finish it in " + sourceLabel(tr.source);
    li.append(from);
    return li;
  }
  const done = el("button", "", "Done");
  done.id = "todo-done-" + tr.id;
  done.type = "button";
  done.addEventListener("click", () => finish(tr.id));
  li.append(done);
  return li;
}

// The groups arrive in order: the focused workspace, then "All workspaces" and one per scope.
function renderTodos(ov) {
  const items = [];
  for (const tg of ov.todo_groups) {
    items.push(el("li", tg.kind === "scope" ? "group sub" : "group", tg.title));
    if (tg.empty) { items.push(el("li", "empty", tg.empty)); }
    for (const tr of tg.todos) { items.push(todoRow(tr)); }
  }
  list.replaceChildren(...items);
  const where = ov.focused_workspace ? "workspace " + ov.focused_workspace : "focused workspace";
  input.placeholder = "What next? (" + where + ")";
}

// ---- data ----

async function loadOverview() {
  const ov = await call("GET", "/view/overview");
  renderNext(ov);
  renderCards(ov);
  renderTodos(ov);
}

// ---- live data: the sessions /now reports ----

function hostText(h) {
  if (!h) { return ""; }
  const parts = [];
  if (h.kind) { parts.push(h.kind); }
  if (h.workspace) { parts.push("ws " + h.workspace); }
  if (h.via) { parts.push("via " + h.via); }
  if (h.confidence) { parts.push(h.confidence); }
  if (h.unresolved) { parts.push("unresolved"); }
  return parts.join(" · ");
}

function tokenText(s) {
  const parts = [];
  if (s.tokens) { parts.push("in " + s.tokens.input + " / out " + s.tokens.output); }
  if (s.context_pct !== undefined && s.context_pct !== null) { parts.push("ctx " + s.context_pct + "%"); }
  return parts.join(" · ");
}

function sessionRow(s, child) {
  const state = (s.state || "unknown") + (s.state_since ? " since " + fmtTime(s.state_since) : "");
  const tool = (s.current_tool || "") + (s.current_target ? " " + s.current_target : "");
  const said = (s.one_liner || "") + (s.one_liner_from ? " (" + s.one_liner_from + ")" : "");
  const h = s.host;
  return {
    cells: [
      s.key, s.kind || "", state, s.waiting_reason || "", tool, hostText(h), s.project_path || "",
      said, tokenText(s), (s.story && s.story.state) || "", fmtTime(s.last_seen),
    ],
    className: child ? "child" : "",
    onClick: () => focusSession(s.key),
  };
}

async function loadLive() {
  const now = await call("GET", "/now");
  const rows = [];
  const walk = (items, child) => (items || []).forEach((s) => {
    rows.push(sessionRow(s, child));
    walk(s.children, true);
  });
  walk(now && now.sessions, false);
  if (rows.length === 0) {
    sessionTable.replaceChildren(el("caption", "muted", "No live session"));
    return;
  }
  fillTable(sessionTable,
    ["Key", "Kind", "State", "Waiting", "Tool", "Host", "Project", "One-liner", "Tokens", "Story", "Last seen"],
    rows);
}

// ---- tabs: one loader each, only the visible one is fetched ----

const TABS = { overview: loadOverview, live: loadLive };

function currentTab() {
  const name = location.hash.substring(1);
  return Object.hasOwn(TABS, name) ? name : "overview";
}

function showTab(name) {
  for (const view of document.querySelectorAll("section[data-tab]")) {
    view.hidden = view.dataset.tab !== name;
  }
  for (const link of document.querySelectorAll("#tabs a")) {
    link.setAttribute("aria-current", link.dataset.tab === name ? "page" : "false");
  }
}

let running = false;
let again = false;

async function refresh() {
  if (running) { again = true; return; }
  running = true;
  try {
    do {
      again = false;
      const name = currentTab();
      showTab(name);
      try {
        await TABS[name]();
        say("");
      } catch (error) {
        say("Cannot load: " + error.message);
      }
    } while (again);
  } finally {
    running = false;
  }
}

window.addEventListener("hashchange", () => { refresh(); });

async function finish(id) {
  try {
    await call("PATCH", "/todos/" + encodeURIComponent(id), { status: "done" });
    say("");
  } catch (error) {
    say("Not done: " + error.message);
  }
  await refresh();
}

document.getElementById("todo-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) { return; }
  try {
    await call("POST", "/todos", { text: text });
    input.value = "";
    say("");
  } catch (error) {
    say("Not added: " + error.message);
  }
  await refresh();
});

// ---- live updates: SSE, reconnecting with a backoff ----

let delay = 1000;
let source = null;

function connect() {
  if (source) { source.close(); }
  source = new EventSource("/events");
  source.addEventListener("open", () => { delay = 1000; refresh(); });
  source.addEventListener("now.changed", () => { refresh(); });
  source.addEventListener("error", () => {
    if (source.readyState === EventSource.CLOSED) {
      source.close();
      setTimeout(connect, delay);
      delay = Math.min(delay * 2, 30000);
    }
  });
}

refresh();
connect();
</script>
</body>
</html>
