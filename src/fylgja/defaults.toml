# Packaged defaults (PLAN-final-plan.md §4.3). The user's config.toml is merged over this file:
# tables merge key by key, and a list in config.toml replaces the list here.

[api]
# The API binds to the loopback address only; any other value is refused.
host = "127.0.0.1"
port = 7319
allowed_origins = ["http://127.0.0.1:7319", "http://localhost:7319"]

[privacy]
# Regular expressions whose matches are replaced in titles and prompt text before persistence.
redact_patterns = [
  "sk-[A-Za-z0-9_-]{16,}",
  "gh[pousr]_[A-Za-z0-9]{20,}",
  "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{16,}",
]
# Records from these applications are dropped before they reach SQLite or SSE.
ignore_bundle_ids = [
  "com.apple.keychainaccess",
  "com.1password.1password",
  "com.agilebits.onepassword7",
]
# Windows whose title matches one of these regular expressions are dropped.
ignore_title_patterns = ["(?i)\\bprivate browsing\\b", "(?i)\\bincognito\\b"]

[actions.message]
enabled = false
max_chars = 8000

[actions.applescript]
chrome = false
iterm2 = false

[summaries]
enabled = false
ttl_seconds = 300
max_concurrent = 3

# The Claude Code hook events `fylgja install hooks` registers, each as an async `fylgja hook <Event>`
# command (A2). Notification and SessionEnd use the matcher "": the hook reads the notification type
# and the end reason from the payload. High-rate events (MessageDisplay, FileChanged) stay out. The
# installer registers only the events the installed Claude version supports.
[hooks]
events = [
  "SessionStart",
  "UserPromptSubmit",
  "PreToolUse",
  "PostToolUse",
  "PostToolUseFailure",
  "PermissionRequest",
  "PermissionDenied",
  "Notification",
  "Stop",
  "StopFailure",
  "SubagentStart",
  "SubagentStop",
  "TaskCreated",
  "TaskCompleted",
  "PreCompact",
  "PostCompact",
  "PostModelSwitch",
  "CwdChanged",
  "SessionEnd",
]

# Focus spans (WP5.2). A span closes when the user goes idle, back-dated to the start of the idle
# period: the presence collector stamps `idle.start` when its threshold was crossed, so the idle
# period began this many seconds earlier. Keep it equal to [collectors.presence]
# idle_threshold_seconds.
[spans]
idle_threshold_seconds = 300

# Navigation items (docs/api/items.md). A ticket key is <PREFIX>-<digits>; an empty list turns ticket detection off.
# Work sessions split at a not-working gap this long. Each ranker has its own [rankers.<name>] table (docs/rankers.md).
[items]
ticket_prefixes = ["CBS"]
default_ranker = "frecency"
work_session_break_minutes = 30

# The frecency ranker (docs/rankers.md). Disable it with enabled = false; [items] default_ranker then falls back.
[rankers.frecency]
half_life_active_minutes = 120
last_session_weight = 1.0

# The recent ranker (docs/rankers.md). A stay shorter than this after a workspace switch is a peek, not a focus; 0
# counts every stay.
[rankers.recent]
min_peek_seconds = 20

# Absolute paths, because launchd's PATH is minimal.
[paths]
aerospace = "/opt/homebrew/bin/aerospace"
gh = "/opt/homebrew/bin/gh"
git = "/usr/bin/git"
codexbar = "/opt/homebrew/bin/codexbar"

# Built-in collectors add their [collectors.<name>] tables here as they land. External plugins are
# never listed: they load only with an explicit `enabled = true` in the user's config.toml.
[collectors]

[collectors.aerospace]
enabled = true
snapshot_interval_seconds = 30

[collectors.claude]
enabled = true
# Registry rows whose cwd matches are dropped: CodexBar's probe sessions. Fylgja's own summarizer
# cwd is always added. A relative entry matches its path components anywhere in the cwd; an
# absolute entry matches that directory and everything below it.
ignore_cwd = ["CodexBar/ClaudeProbe"]

[collectors.codex]
enabled = true
# Running Codex CLI processes, read from `pgrep`/`lsof`, the state database (read-only) and the rollout
# tail. Optional hooks and `notify` are off by default: see docs/collectors/codex.md.

[collectors.opencode]
enabled = true
# Running OpenCode processes (`pgrep`/`lsof`) joined to the sessions in opencode.db, read-only. The
# optional TypeScript plugin (fylgja.ts, copied by hand) only wakes the poll sooner: see
# docs/collectors/opencode.md.

[collectors.norn]
enabled = true
# norn pipeline runs. The inbox (`hook-inbox/norn/`) is drained whenever it exists: norn's own
# `fylgja` event subscriber writes run events and a heartbeat there. The file scan (norn's
# `*.history` and `*.runs/` next to a state key) covers runs started without it, walking `roots`
# to `max_depth`. See docs/collectors/norn.md.
roots = ["~/projects"]
max_depth = 3

[collectors.project]
enabled = true
# The repo-root TODO.md of every project the daemon knows (read-only, from its own store), imported
# as read-only todos of that project and reconciled on every read. See docs/collectors/project.md.
poll_interval_seconds = 5
# Project state (WP5.4): git branch, dirty, ahead/behind and last commit time of every known project
# every state_interval_seconds (sooner, after at least focus_refresh_seconds, when focus moves into
# it); the PR and the GitHub Actions build only of a project with a live session or focus within
# active_window_seconds. gh_calls_per_hour caps the actions-runs calls (a 304 counts too) and
# gh_pr_calls_per_hour the `gh pr view` calls, each in any sixty minutes.
state_interval_seconds = 300
focus_refresh_seconds = 30
active_window_seconds = 3600
gh_calls_per_hour = 30
gh_pr_calls_per_hour = 120
# Quota and spend of the providers the Claude statusline does not cover (WP5.4, §4.7): the CodexBar
# CLI ([paths] codexbar) is asked `usage --provider <p> --json` for each of usage_providers every
# usage_interval_seconds, and `cost --provider <p> --json` (local logs, no login) for each of
# cost_providers every cost_interval_seconds. A provider CodexBar cannot answer is `unavailable` in
# /now with the reason and never degrades the collector. Set usage_enabled = false to stop asking.
usage_enabled = true
usage_providers = ["codex", "copilot"]
cost_providers = ["codex", "claude"]
usage_interval_seconds = 300
cost_interval_seconds = 900
codexbar_timeout_seconds = 45

[collectors.presence]
enabled = true
# Idle (ioreg HIDIdleTime, polled every idle_poll_interval_seconds only while a window is focused),
# screen lock, and microphone or camera in use (ctypes: CoreGraphics, CoreAudio, CoreMediaIO), polled
# every poll_interval_seconds (5 to 10). No permission, no helper. A failing signal degrades the
# collector and is never guessed. See docs/collectors/presence.md.
idle_threshold_seconds = 300
idle_poll_interval_seconds = 15
poll_interval_seconds = 5

[collectors.appcontext]
enabled = true
# What the windows say about the work. Tier 1 parses every window title (every poll_interval_seconds).
# Every JetBrains window also gets its project path here, from a cached recentProjects.xml (re-stat at
# most every 30 s). Tier 2 runs on a focus change only: the selected cmux workspace and tab (cmux's
# session store), the JetBrains path again with a forced re-read, the Obsidian vault and link
# (obsidian.json), and, behind their own switches in [actions.applescript] (both off), the Chrome tab URL and iTerm2's path and job
# (3 s timeout; a timeout disables that one switch until `fylgja doctor` is rerun).
# chrome_history reads Chrome's History file read-only (immutable) for recent visits; it is off.
# See docs/collectors/appcontext.md.
poll_interval_seconds = 0.5
chrome_history = false
history_limit = 10
history_window_seconds = 3600
