name: ci

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Slow marks (launchd, signals, kqueue, wheel build) also run on macOS.
      FYLGJA_RUN_SLOW: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7.19,<0.8"
          python-version: "3.13"
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Sync every dependency group
        run: uv sync --frozen --all-groups
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Ruff check
        run: uv run --frozen ruff check .
      - name: Mypy
        run: uv run --frozen mypy src/fylgja
      - name: Pytest
        run: >-
          uv run --frozen pytest -m "not live" --cov=fylgja --cov-branch
          --cov-report=term-missing --cov-fail-under=85

  independence:
    name: independence (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ">=0.7.19,<0.8"
          python-version: "3.13"
      - name: Lidskjalv independence suite and runbook dry-run
        run: sh scripts/independence_check.sh
